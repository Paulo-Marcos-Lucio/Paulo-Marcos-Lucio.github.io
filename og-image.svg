<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0d1117"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- brand mark -->
  <g transform="translate(80, 90)">
    <rect width="68" height="68" rx="16" fill="url(#grad)"/>
    <text x="34" y="48" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-weight="800" font-size="28" fill="#0a0d12" letter-spacing="-0.5">PM</text>
  </g>
  <text x="170" y="138" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="22" fill="#c9d1d9">paulo-marcos-lucio.github.io</text>

  <!-- title -->
  <text x="80" y="270" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="76" fill="#e6edf3" letter-spacing="-2">Paulo Marcos Lucio</text>
  <text x="80" y="335" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="36" fill="#8b949e">Eng. Java Pleno · Consultor Regulatório BR</text>

  <!-- gradient line -->
  <rect x="80" y="370" width="220" height="4" rx="2" fill="url(#grad)"/>

  <!-- suite chips -->
  <g font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="22" fill="#e6edf3">
    <g transform="translate(80, 430)">
      <rect width="220" height="56" rx="12" fill="#161b22" stroke="#2f3742"/>
      <text x="28" y="36">⚡ Pix Automático</text>
    </g>
    <g transform="translate(312, 430)">
      <rect width="170" height="56" rx="12" fill="#161b22" stroke="#2f3742"/>
      <text x="28" y="36">🔍 DICT</text>
    </g>
    <g transform="translate(494, 430)">
      <rect width="190" height="56" rx="12" fill="#161b22" stroke="#2f3742"/>
      <text x="28" y="36">📡 Pix NFC</text>
    </g>
    <g transform="translate(696, 430)">
      <rect width="290" height="56" rx="12" fill="#161b22" stroke="#2f3742"/>
      <text x="28" y="36">💳 Open Finance</text>
    </g>
    <g transform="translate(998, 430)">
      <rect width="125" height="56" rx="12" fill="#161b22" stroke="#2f3742"/>
      <text x="22" y="36">🛡️ OPIN</text>
    </g>
  </g>

  <!-- footer -->
  <text x="80" y="570" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" fill="#8b949e">Suíte de Referência Regulatória BR · Open source · MIT</text>
</svg>
