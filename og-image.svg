      <stop offset="52%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="100%" cy="100%" r="60%">
